name: Update some list

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Every day at 00:05 CST (UTC+8)
    - cron: '5 16 * * *'
  watch:
    types: [started]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          token = os.environ["GITHUB_TOKEN"]
          username = os.environ["GITHUB_USERNAME"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-stars-generator"
          }

          repos = []

          # Get all starred repositories
          for page in range(1, 100):
              url = (
                  "https://api.github.com/user/starred"
                  f"?per_page=100&page={page}"
              )

              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

          print(f"Found {len(repos)} starred repositories.")

          # Group repositories by primary language
          grouped = {}

          for repo in repos:
              language = repo.get("language") or "miscellaneous"

              grouped.setdefault(language, []).append({
                  "name": repo["full_name"],
                  "url": repo["html_url"],
                  "description": repo.get("description") or "",
                  "stars": repo.get("stargazers_count", 0),
                  "forks": repo.get("forks_count", 0)
              })

          # Sort languages alphabetically
          grouped = dict(
              sorted(
                  grouped.items(),
                  key=lambda item: item[0].lower()
              )
          )

          # Sort repositories inside each language
          for language in grouped:
              grouped[language].sort(
                  key=lambda repo: repo["name"].lower()
              )

          # Generate README
          lines = []

          lines.append(f"# {username}'s Stars")
          lines.append("")
          lines.append(
              "> ⭐ Automatically generated list of my GitHub stars."
          )
          lines.append("")
          lines.append("## Table of Contents")
          lines.append("")

          for language in grouped:
              anchor = language.lower().replace(" ", "-")
              lines.append(f"- [{language}](#{anchor})")

          lines.append("")

          for language, repositories in grouped.items():
              lines.append(f"## {language}")
              lines.append("")

              for repo in repositories:
                  name = repo["name"]
                  url = repo["url"]
                  description = repo["description"]

                  if description:
                      lines.append(
                          f"- [{name}]({url}) - {description}"
                      )
                  else:
                      lines.append(
                          f"- [{name}]({url})"
                      )

              lines.append("")

          readme = "\n".join(lines)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)

          print("README.md generated successfully.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update starred repositories"
          git push
